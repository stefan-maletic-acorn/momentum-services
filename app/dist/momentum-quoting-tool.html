<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300..700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root {
  
  --acorn-green:      #23dba7;  
  --acorn-purple:     #743bfc;  
  --acorn-red:        #ea5274;  
  --acorn-yellow:     #fcb01a;  
  --acorn-blue-black: #16252d;  

  
  --white:    #ffffff;
  --paper:    #fbfbfb;
  --ink:      #16252d;
  --gray-100: #f5f5f5;
  --gray-600: #405f7c;
  --gray-700: #2c3539;
  --slate-100:#d5d8d9;  

  
  --green-500:  #23dba7;  --green-300:  #91edd3;  --green-100:  #d3f8ed;  --green-50:  #e9fbf6;
  --purple-500: #743bfc;  --purple-300: #b99dfd;  --purple-100: #e3d8fd;  --purple-50: #f1ebff;
  --yellow-500: #fcb01a;  --yellow-300: #fdd78c;  --yellow-100: #feefd1;  --yellow-50: #fff7e8;
  --red-500:    #ea5274;  --red-300:    #f4a8b9;  --red-100:    #fbdce3;  --red-50:    #fdedf1;

  
  --color-bg:            var(--white);
  --color-bg-muted:      var(--gray-100);
  --color-bg-dark:       var(--acorn-blue-black);
  --color-bg-brand:      var(--acorn-purple);
  --color-bg-accent:     var(--acorn-green);
  --color-fg:            var(--acorn-blue-black);
  --color-fg-muted:      var(--gray-600);
  --color-fg-on-dark:    var(--white);
  --color-fg-on-brand:   var(--white);
  --color-fg-accent:     var(--acorn-green);
  --color-fg-link:       var(--acorn-purple);
  --color-border:        #e5e7eb;
  --color-focus-ring:    var(--acorn-purple);
  --color-success:       var(--acorn-green);
  --color-warning:       var(--acorn-yellow);
  --color-danger:        var(--acorn-red);

  
  --chart-1:     var(--purple-500);
  --chart-2:     var(--yellow-500);
  --chart-3:     var(--gray-600);
  --chart-4:     var(--green-500);
  --chart-5:     var(--acorn-blue-black);
  --chart-6:     var(--purple-300);
  --chart-other: var(--slate-100);

  
  --chart-seq-1:    var(--acorn-blue-black);
  --chart-seq-2:    var(--purple-500);
  --chart-seq-3:    var(--purple-300);
  --chart-seq-4:    var(--purple-100);
  --chart-seq-edge: var(--purple-300);   

  
  --chart-nm:       var(--color-border);

  
  --momentum-trigger:     #e64f77;  
  --momentum-event:       #54b394;  
  --momentum-action-form: #223976;  
  --momentum-action-wait: #e64f77;  
  --momentum-terminal:    #9d5ca4;  

  
  --font-display: "Signika", ui-sans-serif, system-ui, sans-serif;
  --font-body:    "Roboto", ui-sans-serif, system-ui, sans-serif;
  --font-hand:    "Gochi Hand", cursive;
  --font-mono:    ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  
  --fs-xs: 0.75rem; --fs-sm: 0.875rem; --fs-base: 1rem; --fs-lg: 1.25rem;
  --fs-xl: 1.5rem;  --fs-2xl: 1.75rem; --fs-3xl: 2rem;  --fs-4xl: 2.5rem;
  --fs-5xl: 3.375rem; --fs-6xl: 4rem;

  
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px;
  --radius-lg: 16px; --radius-xl: 24px; --radius-pill: 9999px;

  
  --shadow-sm:   0 1px 2px rgba(22,37,45,.06);
  --shadow-md:   0 4px 12px rgba(22,37,45,.08);
  --shadow-lg:   0 10px 25px rgba(22,37,45,.10);
  --shadow-card: 0 10px 30px rgba(116,59,252,.08);

  
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --space-6: 32px; --space-7: 48px; --space-8: 64px; --space-9: 96px;

  
  --ease-acorn: cubic-bezier(0.77, 0, 0.18, 1);
  --dur-fast: 200ms;
  --dur-med:  500ms;
  --dur-slow: 2s;
}
</style>
<style>
/* The quoting tool's own styles. Tokens only: every colour, font, size,
 * radius and shadow is a design-system variable. Scoped under .mq. */

.mq{
  --color-page:var(--paper);
  --color-surface:var(--white);
  --rail-w:240px; --side-w:320px; --bar:64px;
  font-family:var(--font-body); color:var(--color-fg); background:var(--color-page);
  min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){.mq:not([data-theme="light"]){
  --color-surface:#131b21;--color-page:#0b1014;--color-bg:#131b21;--color-bg-muted:#1a2329;
  --paper:#172026;--color-fg:#e6edf1;--color-fg-muted:#9aa7ae;
  --color-fg-link:var(--purple-300);--color-border:#2a353d;--gray-100:#1a2329;
  --purple-100:#2b2148;--purple-50:#1c1733;--red-50:#2f171e;
  --yellow-50:#2f2412;--green-100:#123830;--green-50:#0f2a24}}
.mq[data-theme="dark"]{
  --color-surface:#131b21;--color-page:#0b1014;--color-bg:#131b21;--color-bg-muted:#1a2329;
  --paper:#172026;--color-fg:#e6edf1;--color-fg-muted:#9aa7ae;
  --color-fg-link:var(--purple-300);--color-border:#2a353d;--gray-100:#1a2329;
  --purple-100:#2b2148;--purple-50:#1c1733;--red-50:#2f171e;
  --yellow-50:#2f2412;--green-100:#123830;--green-50:#0f2a24}

.mq *,.mq *::before,.mq *::after{box-sizing:border-box}
.mq h1,.mq h2,.mq h3,.mq h4{font-family:var(--font-display);font-weight:700;line-height:1.15;
  letter-spacing:-0.02em;text-wrap:balance;margin:0;color:inherit}
.mq h1{font-size:var(--fs-xl)}
.mq h2{font-size:var(--fs-3xl);letter-spacing:-0.03em}
.mq h3{font-size:var(--fs-lg)}
.mq h4{font-size:var(--fs-base);font-weight:600}
.mq p{margin:0}
.mq a{color:var(--color-fg-link)}
.mq :focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}
.mq .num{font-variant-numeric:tabular-nums}
.mq .muted{color:var(--color-fg-muted)}
.mq .small{font-size:var(--fs-sm)}
.mq .eyebrow{font-family:var(--font-display);font-weight:600;font-size:var(--fs-xs);
  letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted)}
.mq-noscript{padding:var(--space-6);text-align:center}

/* Header band. Blue-black, white text - the one dark band on the page. */
.mq-bar{position:sticky;top:0;z-index:20;min-height:var(--bar);background:var(--acorn-blue-black);
  color:var(--white);display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-6)}
.mq-bar .brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.mq-bar .brand .eyebrow{color:var(--green-300)}
.mq-bar h1{color:var(--white);font-size:var(--fs-lg)}
.mq-bar nav{margin-left:auto;display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:flex-end}

/* Buttons: the Acorn recipe. Signika 700, all caps, softly rounded. */
.mq .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  font-family:var(--font-display);font-weight:700;font-size:var(--fs-sm);letter-spacing:.04em;
  text-transform:uppercase;padding:12px 22px;border:0;border-radius:var(--radius-sm);cursor:pointer;
  transition:background var(--dur-fast) ease,color var(--dur-fast) ease;text-decoration:none;line-height:1.2;min-height:44px}
.mq .btn:disabled{opacity:.5;cursor:not-allowed}
.mq .btn-green{background:var(--acorn-green);color:var(--acorn-blue-black)}
.mq .btn-green:hover:not(:disabled){background:var(--acorn-purple);color:var(--white)}
.mq .btn-purple{background:var(--acorn-purple);color:var(--white)}
.mq .btn-purple:hover:not(:disabled){background:var(--acorn-blue-black);color:var(--white)}
.mq .btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.mq .btn-ghost:hover:not(:disabled){background:var(--purple-100);color:var(--color-fg)}
.mq-bar .btn-ghost:hover:not(:disabled){background:var(--white);color:var(--acorn-blue-black)}
.mq .btn-ghost[aria-current="page"]{background:var(--white);color:var(--acorn-blue-black);box-shadow:none}
.mq .btn-sm{padding:8px 14px;font-size:var(--fs-xs);min-height:36px}
.mq .btn-text{background:none;border:0;padding:0;color:var(--color-fg-link);cursor:pointer;
  font:inherit;text-decoration:underline;text-underline-offset:2px}

/* Page grid: rail, main, side. */
.mq-page{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--side-w);
  gap:var(--space-7);align-items:start;max-width:1560px;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-9)}
@media (max-width:1280px){.mq-page{grid-template-columns:var(--rail-w) minmax(0,1fr);gap:var(--space-6)}
  .mq-side{grid-column:1 / -1;position:static}}
@media (max-width:800px){.mq-page{grid-template-columns:1fr;gap:var(--space-5);padding:var(--space-5) var(--space-4) var(--space-8)}
  .mq-rail{position:static;max-height:none}
  .mq-rail ol{flex-direction:row;overflow-x:auto;gap:var(--space-2);padding-bottom:var(--space-2)}
  .mq-rail li{flex:0 0 auto}
  .mq-rail .group{display:none}
  .mq-rail .rail-step{padding:8px 12px;min-height:0;background:var(--color-surface);border:1px solid var(--color-border)}
  .mq-rail .rail-step .label{white-space:nowrap}
  .mq-rail .rail-step[aria-current="step"]{border-color:var(--acorn-purple)}}

/* Rail: the twelve steps, one current. */
.mq-rail{position:sticky;top:calc(var(--bar) + var(--space-5));max-height:calc(100vh - var(--bar) - var(--space-7));overflow:auto}
.mq-rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mq-rail .group{margin-top:var(--space-5);padding:0 var(--space-3) var(--space-2)}
.mq-rail .group:first-child{margin-top:0}
.mq-rail .rail-step{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:none;border:0;border-radius:var(--radius-sm);padding:8px var(--space-3);min-height:42px;cursor:pointer;
  color:var(--color-fg);font:inherit;font-size:var(--fs-sm);line-height:1.25;transition:background var(--dur-fast) ease}
.mq-rail .rail-step:hover{background:var(--purple-50)}
.mq-rail .rail-step[aria-current="step"]{background:var(--acorn-purple);color:var(--white)}
.mq-rail .rail-step .dot{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:var(--fs-xs);
  border:1.5px solid var(--color-border);color:var(--color-fg-muted);background:var(--color-surface)}
.mq-rail .rail-step.done .dot{background:var(--acorn-green);border-color:var(--acorn-green);color:var(--acorn-blue-black)}
.mq-rail .rail-step[aria-current="step"] .dot{background:var(--white);border-color:var(--white);color:var(--acorn-purple)}
.mq-rail .rail-step .label{flex:1;min-width:0}
.mq-rail .rail-step .pts{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;height:22px;min-width:22px;
  font-family:var(--font-display);font-weight:700;font-size:var(--fs-xs);padding:0 7px;border-radius:var(--radius-pill);
  background:var(--purple-100);color:var(--color-fg)}
.mq-rail .rail-step[aria-current="step"] .pts{background:var(--white);color:var(--acorn-purple)}

/* Main pane: one step as a card. Content is grouped in .sec blocks so a
   heading sits with the thing it labels, and sections sit apart. */
.mq-main{min-width:0}
.mq-card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);
  padding:var(--space-7);display:flex;flex-direction:column;gap:var(--space-7)}
@media (max-width:800px){.mq-card{padding:var(--space-5);gap:var(--space-6)}}
.mq-card header{display:flex;flex-direction:column;gap:var(--space-3)}
.mq-card header .lede{max-width:70ch;color:var(--color-fg-muted);font-size:var(--fs-base)}
.mq-card footer{display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;
  padding-top:var(--space-5);border-top:1px solid var(--color-border)}
.mq .sec{display:flex;flex-direction:column;gap:var(--space-4)}
.mq .sec > h3 + .why,.mq .sec > h3 + p{margin-top:calc(-1 * var(--space-2))}
.mq .prose{max-width:65ch;display:flex;flex-direction:column;gap:var(--space-3)}

/* Ask / why blocks on a factor step. */
.mq .ask{background:var(--purple-50);border-radius:var(--radius-md);padding:var(--space-5) var(--space-6);
  display:flex;flex-direction:column;gap:var(--space-2);max-width:80ch}
.mq .ask .eyebrow{color:var(--acorn-purple)}
.mq .ask blockquote{margin:0;font-size:var(--fs-xl);font-family:var(--font-display);font-weight:600;line-height:1.3;letter-spacing:-0.01em}
.mq .why{max-width:80ch;color:var(--color-fg-muted);font-size:var(--fs-sm);line-height:1.55}

/* Selectable cards: options on a factor step and Care tiers. Same recipe. */
.mq .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.mq .options.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.mq .options,.mq .options.two{grid-template-columns:1fr}}
.mq .pick{position:relative;display:flex;flex-direction:column;gap:var(--space-2);text-align:left;background:var(--color-surface);
  border:2px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-5);cursor:pointer;
  color:var(--color-fg);font:inherit;transition:border-color var(--dur-fast) ease,background var(--dur-fast) ease}
.mq .pick:hover{border-color:var(--purple-300)}
.mq .pick[aria-pressed="true"]{border-color:var(--acorn-purple);background:var(--purple-50)}
.mq .pick[aria-pressed="true"]::after{content:"✓";position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;
  background:var(--acorn-green);color:var(--acorn-blue-black);font-family:var(--font-display);font-weight:700;font-size:var(--fs-sm);
  display:inline-flex;align-items:center;justify-content:center}
.mq .opt{min-height:132px;padding-right:calc(var(--space-5) + 20px)}
.mq .opt .pts{font-family:var(--font-display);font-weight:700;font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--acorn-purple)}
.mq .opt .txt{font-weight:500;line-height:1.35;font-size:var(--fs-base)}
.mq .opt .hint{font-size:var(--fs-sm);color:var(--color-fg-muted)}
.mq .rule{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);
  border-radius:var(--radius-sm);background:var(--yellow-50);font-size:var(--fs-sm);line-height:1.5;max-width:80ch}
.mq .rule::before{content:"";flex:0 0 4px;align-self:stretch;border-radius:2px;background:var(--acorn-yellow)}
.mq .rule.good{background:var(--green-50)}
.mq .rule.good::before{background:var(--acorn-green)}
.mq .rule.info{background:var(--purple-50)}
.mq .rule.info::before{background:var(--acorn-purple)}

/* Form fields. */
.mq .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
@media (max-width:640px){.mq .fields{grid-template-columns:1fr}}
.mq .field{display:flex;flex-direction:column;gap:6px}
.mq .field label,.mq .field .lbl{font-family:var(--font-display);font-weight:600;font-size:var(--fs-sm)}
.mq input[type=text],.mq input[type=date],.mq input[type=number],.mq select{
  font:inherit;font-size:var(--fs-base);color:var(--color-fg);background:var(--color-surface);
  border:1.5px solid var(--color-border);border-radius:var(--radius-sm);padding:10px 14px;min-height:44px;width:100%;min-width:0}
.mq input:focus,.mq select:focus{border-color:var(--acorn-purple);outline:none;box-shadow:0 0 0 3px var(--purple-100)}
.mq .check{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-5);border:1.5px solid var(--color-border);border-radius:var(--radius-md)}
.mq .check .q{font-weight:500;line-height:1.4}

/* Segmented controls: one row, never wrapping, equal height. */
.mq .seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,auto);border:1.5px solid var(--color-border);
  border-radius:var(--radius-sm);overflow:hidden;width:max-content;max-width:100%}
.mq .seg button{background:var(--color-surface);border:0;padding:12px 20px;min-height:44px;font-family:var(--font-display);font-weight:600;
  font-size:var(--fs-sm);color:var(--color-fg);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast) ease}
.mq .seg button + button{border-left:1.5px solid var(--color-border)}
.mq .seg button[aria-pressed="true"]{background:var(--acorn-purple);color:var(--white)}
.mq .seg button:hover:not([aria-pressed="true"]){background:var(--purple-50)}
.mq .seg.compact button{padding:8px 16px;min-height:40px}
@media (max-width:640px){.mq .seg:not(.compact){grid-auto-flow:row;width:100%}
  .mq .seg:not(.compact) button + button{border-left:0;border-top:1.5px solid var(--color-border)}}

/* Toggles: a bordered row with a real checkbox, centred. */
.mq .toggle{display:flex;align-items:center;gap:var(--space-4);cursor:pointer;padding:14px var(--space-5);
  border:1.5px solid var(--color-border);border-radius:var(--radius-md);line-height:1.45}
.mq .toggle:has(input:checked){border-color:var(--acorn-purple);background:var(--purple-50)}
.mq .toggle:has(input:disabled){opacity:.55;cursor:not-allowed}
.mq .toggle input{width:20px;height:20px;margin:0;accent-color:var(--acorn-purple);flex:0 0 auto}
.mq .toggle.small{padding:8px 12px;gap:var(--space-2);font-size:var(--fs-sm)}

/* Tables. */
.mq .tbl-wrap{overflow-x:auto}
.mq table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.mq th,.mq td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--color-border);vertical-align:top;line-height:1.45}
.mq th{font-family:var(--font-display);font-weight:600;font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--color-fg-muted);white-space:nowrap}
.mq td.num,.mq th.num{text-align:right;white-space:nowrap}
.mq tr.total td{font-family:var(--font-display);font-weight:700;font-size:var(--fs-base);border-bottom:0;border-top:2px solid var(--color-fg)}
.mq tr.current td{font-weight:700;background:var(--purple-50)}
.mq td .detail{display:block;color:var(--color-fg-muted);font-size:var(--fs-xs);font-weight:400}

/* Care tier picker: the same selectable card, with a 2x2 stat grid. */
.mq .care-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
@media (max-width:800px){.mq .care-grid{grid-template-columns:1fr}}
.mq .care .name{font-family:var(--font-display);font-weight:700;font-size:var(--fs-lg);padding-right:32px}
.mq .care .fee{font-family:var(--font-display);font-weight:700;font-size:var(--fs-3xl);letter-spacing:-0.03em;line-height:1;margin-top:var(--space-1)}
.mq .care .basis{font-size:var(--fs-sm);color:var(--color-fg-muted)}
.mq .care .stats{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-3);
  padding-top:var(--space-4);border-top:1px solid var(--color-border)}
.mq .care .stat{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3);min-width:0}
.mq .care .stat .v{text-align:right}
.mq .care .stat .k{font-family:var(--font-display);font-weight:600;font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--color-fg-muted)}
.mq .care .stat .v{font-size:var(--fs-sm);font-weight:500;line-height:1.35}

/* Tier result. */
.mq .tier-hero{display:grid;grid-template-columns:auto 1fr;gap:var(--space-6);align-items:center;padding:var(--space-6);
  border-radius:var(--radius-md);background:var(--purple-50)}
@media (max-width:640px){.mq .tier-hero{grid-template-columns:1fr}}
.mq .tier-hero .score{font-family:var(--font-display);font-weight:700;font-size:var(--fs-6xl);line-height:1;letter-spacing:-0.04em;color:var(--acorn-purple);text-align:center}
.mq .tier-hero .score small{display:block;font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted);font-weight:600;margin-top:6px}
.mq .tier-hero .name{font-family:var(--font-display);font-weight:700;font-size:var(--fs-4xl);letter-spacing:-0.03em;line-height:1.05;margin-bottom:var(--space-2)}
.mq .factor-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--space-6)}
@media (max-width:640px){.mq .factor-list{grid-template-columns:1fr}}
.mq .factor-list li{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);padding:12px 0;border-bottom:1px solid var(--color-border);font-size:var(--fs-sm)}
.mq .factor-list .f{display:block;font-weight:500}
.mq .factor-list .o{display:block;color:var(--color-fg-muted);font-size:var(--fs-xs);margin-top:2px}
.mq .factor-list .pts{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:26px;padding:0 9px;
  font-family:var(--font-display);font-weight:700;border-radius:var(--radius-pill);background:var(--purple-100);color:var(--color-fg)}
.mq .factor-list .pts.three{background:var(--acorn-yellow);color:var(--acorn-blue-black)}
.mq .lower{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-2)}
.mq .lower li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-4);padding:12px 16px;border-radius:var(--radius-sm);background:var(--green-50);font-size:var(--fs-sm);line-height:1.45}
.mq .lower li b.num{white-space:nowrap;font-family:var(--font-display);font-size:var(--fs-base)}

/* Extra lines editor. */
.mq .extras{display:flex;flex-direction:column;gap:var(--space-2)}
.mq .extra-row{display:grid;grid-template-columns:minmax(0,2fr) 160px auto auto auto;gap:var(--space-3);align-items:center}
@media (max-width:800px){.mq .extra-row{grid-template-columns:1fr 1fr} .mq .extra-row .seg{grid-column:1 / -1}}

/* Side summary. */
.mq-side{position:sticky;top:calc(var(--bar) + var(--space-5));display:flex;flex-direction:column;gap:var(--space-4)}
.mq-side .panel{background:var(--acorn-blue-black);color:var(--white);border-radius:var(--radius-lg);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.mq-side .panel .eyebrow{color:var(--green-300)}
.mq-side .big{font-family:var(--font-display);font-weight:700;font-size:var(--fs-4xl);letter-spacing:-0.03em;line-height:1}
.mq-side .big small{display:block;font-family:var(--font-body);font-weight:400;font-size:var(--fs-sm);color:var(--gray-100);opacity:.8;margin-top:8px;letter-spacing:0}
.mq-side dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:10px 12px;font-size:var(--fs-sm)}
.mq-side dt{opacity:.8}
.mq-side dd{margin:0;text-align:right;font-weight:500}
.mq-side .score-track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.mq-side .score-track span{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.mq-side .score-track span.p1{background:var(--acorn-green)}
.mq-side .score-track span.p2{background:var(--purple-300)}
.mq-side .score-track span.p3{background:var(--acorn-yellow)}
.mq-side .note{font-size:var(--fs-xs);opacity:.75;line-height:1.5}
.mq-side .who{padding:0 var(--space-2);font-size:var(--fs-sm);color:var(--color-fg-muted)}

/* Quote step. */
.mq .quote-head{display:flex;justify-content:space-between;gap:var(--space-5);flex-wrap:wrap;align-items:flex-end}
.mq .quote-head .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:var(--fs-sm);margin:0}
.mq .quote-head .meta dt{color:var(--color-fg-muted)}
.mq .quote-head .meta dd{margin:0;font-weight:500}
.mq .totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
@media (max-width:640px){.mq .totals{grid-template-columns:1fr}}
.mq .tile{border:1.5px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-5);display:flex;flex-direction:column;gap:6px}
.mq .tile.lead{background:var(--acorn-green);border-color:var(--acorn-green);color:var(--acorn-blue-black)}
.mq .tile .v{font-family:var(--font-display);font-weight:700;font-size:var(--fs-3xl);letter-spacing:-0.03em;line-height:1.05}
.mq .tile .k{font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;font-weight:600;font-family:var(--font-display)}
.mq .tile.lead .k,.mq .tile.lead .small{color:var(--acorn-blue-black)}
.mq .tile:not(.lead) .k{color:var(--color-fg-muted)}
.mq .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6)}
@media (max-width:640px){.mq .cols{grid-template-columns:1fr}}
.mq .cols ul{margin:0;padding-left:1.1em;font-size:var(--fs-sm);display:flex;flex-direction:column;gap:8px;line-height:1.5}
.mq .cols h4{margin-bottom:var(--space-3)}
.mq .actions{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}
.mq .toast{font-size:var(--fs-sm);color:var(--color-fg-muted)}
.mq details.terms summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:var(--fs-lg)}
.mq details.terms{border-top:1px solid var(--color-border);padding-top:var(--space-4)}

/* Library. */
.mq-lib{max-width:1560px;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-9);display:flex;flex-direction:column;gap:var(--space-5)}
.mq-lib header{display:flex;flex-direction:column;gap:var(--space-2)}
.mq-lib .row-actions{display:flex;gap:var(--space-2);white-space:nowrap}
.mq .empty{padding:var(--space-7);text-align:center;color:var(--color-fg-muted);border:1.5px dashed var(--color-border);border-radius:var(--radius-md)}
.mq .chip{display:inline-block;font-family:var(--font-display);font-weight:600;font-size:var(--fs-xs);padding:3px 10px;border-radius:var(--radius-pill);background:var(--purple-100);color:var(--color-fg)}
.mq .chip.green{background:var(--green-100)}

@media (prefers-reduced-motion:reduce){.mq *{transition-duration:1ms!important}}

/* Print: the client-facing quote sheet only. */
@media print{
  .mq{background:#fff;color:#000}
  .mq-bar,.mq-rail,.mq-side,.mq-card footer,.mq .actions,.mq .no-print{display:none!important}
  .mq-page{display:block;padding:0;max-width:none}
  .mq-card{box-shadow:none;padding:0;border-radius:0;gap:var(--space-5)}
  .mq .tile.lead{background:#fff;border:2px solid #000}
  .mq details.terms{display:block}
  .mq details.terms[open] summary{display:none}
}

/* The Momentum Services pricing engine.
 *
 * Pure functions over the commercial model (pricing/commercial-model.json)
 * and a set of inputs. No DOM, no state, so app/test/model.test.mjs can hold
 * it to the worked examples in the document and the page can call the same
 * code. Every number comes from the model; this file only does arithmetic.
 *
 *   MQ.scoreTier(model, scores, linked)   -> the tier and the rules that fired

    return sign * Math.round(Math.abs(v) + 1e-9);
  }

  function tierByKey(model, key) {
    for (var i = 0; i < model.scorecard.tiers.length; i++) {
      if (model.scorecard.tiers[i].key === key) return model.scorecard.tiers[i];
    }
    return null;
  }

  function careTierByKey(model, key) {
    for (var i = 0; i < model.care.tiers.length; i++) {

  // ---------------------------------------------------------------------
  // events
  // ---------------------------------------------------------------------

  function update(fn) { fn(); state.toast = ""; saveDraft(); render(); }

  function onClick(ev) {
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "go") return update(function () { state.step = parseInt(el.getAttribute("data-step"), 10); state.view = "wizard"; window.scrollTo(0, 0); });
    if (act === "view") return update(function () { state.view = el.getAttribute("data-view"); window.scrollTo(0, 0); });
    if (act === "new") return update(function () { state.inputs = blankInputs(); state.step = 0; state.savedId = null; state.view = "wizard"; window.scrollTo(0, 0); });
    if (act === "check") return update(function () { state.inputs.engagement.checks[el.getAttribute("data-key")] = el.getAttribute("data-val"); delete state.inputs.example; });
    if (act === "score") return update(function () {
      state.inputs.scores[el.getAttribute("data-key")] = parseInt(el.getAttribute("data-pts"), 10); delete state.inputs.example;
      if (state.step < STEPS.length - 1 && STEPS[state.step].key === "factor") { state.step += 1; window.scrollTo(0, 0); }
    });
    if (act === "care") return update(function () { state.inputs.careTier = el.getAttribute("data-key"); if (state.inputs.careTier !== model.care.extended_coverage.tier) state.inputs.extendedCoverage = false; });
    if (act === "years") return update(function () { state.inputs.years = parseInt(el.getAttribute("data-years"), 10); });
    if (act === "repeat") return update(function () { state.inputs.repeat = el.getAttribute("data-key"); });
    if (act === "extra-add") return update(function () { state.inputs.extras.push({ label: "", amount: "", kind: "oneoff", indexed: false }); });
    if (act === "extra-del") return update(function () { state.inputs.extras.splice(parseInt(el.getAttribute("data-i"), 10), 1); });
    if (act === "extra-kind") return update(function () { var x = state.inputs.extras[parseInt(el.getAttribute("data-i"), 10)]; x.kind = el.getAttribute("data-kind"); if (x.kind !== "annual") x.indexed = false; });
    if (act === "copy") return copySummary();
    if (act === "print") { window.print(); return; }
    if (act === "save") return saveQuote();
    if (act === "open") return openQuote(el.getAttribute("data-id"));
    if (act === "delete") return deleteQuote(el.getAttribute("data-id"));
  }

  function onChange(ev) {
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "eng") return update(function () { state.inputs.engagement[el.getAttribute("data-key")] = el.value; delete state.inputs.example; });
    if (act === "linked") return update(function () { state.inputs.linked = el.checked; });
    if (act === "extended") return update(function () { state.inputs.extendedCoverage = el.checked; });
    if (act === "extra") return update(function () {
      var x = state.inputs.extras[parseInt(el.getAttribute("data-i"), 10)], k = el.getAttribute("data-key");
      x[k] = k === "amount" ? (el.value === "" ? "" : Number(el.value)) : el.value;
    });
    if (act === "extra-indexed") return update(function () { state.inputs.extras[parseInt(el.getAttribute("data-i"), 10)].indexed = el.checked; });
  }

  function onInput(ev) {
    // Keep the engagement fields live in state without re-rendering on every keystroke.
    var el = ev.target.closest('[data-act="eng"]');
    if (el) { state.inputs.engagement[el.getAttribute("data-key")] = el.value; saveDraft(); }
  }

  function copySummary() {
    var q = currentQuote();
    if (!q.ready) return;
    var text = MQ.summaryText(model, q, state.inputs);
    var done = function () { state.toast = "Summary copied."; render(); };
    var fail = function () { state.toast = "Could not copy. Select the quote and copy it by hand."; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else {
      try {
        var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta); done();
      } catch (e) { fail(); }
    }
  }

  // ---------------------------------------------------------------------
  // the shared library
  // ---------------------------------------------------------------------

  function connectDb() {
    var p = null;
    try { if (root.claude && typeof root.claude.use === "function") p = root.claude.use("db"); } catch (e) { p = null; }
    if (!p) { state.dbState = "none"; render(); return; }
    p.then(function (db) {
      if (!db) { state.dbState = "none"; render(); return; }
      state.db = db; state.dbState = "ready";
      try {
        db.collection("quotes").orderBy("savedAt", "desc").limit(500).onSnapshot(function (snap) {
          state.quotes = snap.docs.filter(function (d) { return d.exists; }).map(function (d) { return Object.assign({ id: d.id }, d.data()); });
          state.quotesLoaded = true; render();
        }, function (err) { state.dbState = "none"; state.toast = "The library stopped responding (" + (err && err.code ? err.code : "unavailable") + ")."; render(); });
      } catch (e) { state.dbState = "none"; render(); }
      render();
    }, function () { state.dbState = "none"; render(); });
  }

  function summaryFor(q) {
    var e = state.inputs.engagement;
    return { client: e.client, workflow: e.workflow, preparedBy: e.preparedBy, date: e.date,
             tier: q.tier.label, score: q.score.total, careTier: q.careTier.label, years: q.years,
             total: q.contract, year1: q.year1, recurring: q.recurring, indicative: q.indicative };
  }

  function saveQuote() {
    var q = currentQuote();
    if (!q.ready || !state.db) return;
    var inputs = JSON.parse(JSON.stringify(state.inputs)); delete inputs.example;
    var body = { inputs: inputs, summary: summaryFor(q), modelVersion: model.version, savedAt: new Date().toISOString() };
    var ref = state.savedId ? state.db.doc("quotes/" + state.savedId) : state.db.collection("quotes").doc();
    ref.set(body).then(function () {
      state.savedId = ref.id; state.toast = state.savedId ? "Saved to the library." : "Saved."; saveDraft(); render();
    }, function (err) {
      state.toast = err && err.code === "quota_exceeded" ? "The library is full. Delete an old quote and try again." : "Could not save (" + (err && err.code ? err.code : "unavailable") + "). Try once more.";
      render();
    });
  }

  function openQuote(id) {
    var d = null;
    state.quotes.forEach(function (x) { if (x.id === id) d = x; });
    if (!d || !d.inputs) return;
    update(function () {
      var inp = blankInputs();
      state.inputs = Object.assign(inp, d.inputs, { engagement: Object.assign(inp.engagement, d.inputs.engagement || {}) });
      state.savedId = id; state.step = STEPS.length - 1; state.view = "wizard"; window.scrollTo(0, 0);
    });
  }

  function deleteQuote(id) {
    if (!state.db) return;
    var d = null; state.quotes.forEach(function (x) { if (x.id === id) d = x; });
    var name = d && d.summary ? (d.summary.client + (d.summary.workflow ? " · " + d.summary.workflow : "")) : "this quote";
    if (!window.confirm("Delete " + name + " from the shared library? Everyone loses it.")) return;
    state.db.doc("quotes/" + id).delete().then(function () {
      if (state.savedId === id) state.savedId = null;
      state.toast = "Deleted."; saveDraft(); render();
    }, function () { state.toast = "Could not delete. Try once more."; render(); });
  }

  // ---------------------------------------------------------------------

  function start() {
    loadDraft();
    var app = document.getElementById("app");
    app.addEventListener("click", onClick);
    app.addEventListener("change", onChange);
    app.addEventListener("input", onInput);
    window.addEventListener("beforeprint", function () {
      var t = document.querySelector(".mq details.terms"); if (t) t.open = true;
    });
    render();
    connectDb();
  }

  root.MQAPP = { start: start, STEPS: STEPS, state: state };
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
MQAPP.start();
</script>
